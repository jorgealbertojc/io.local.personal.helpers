[project]
name = "io-local-personal-helpers"
version = "0.0.1"
description = "A wrapper CLI for system administration commands on Ubuntu."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
os = "oswrap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oswrap"]
